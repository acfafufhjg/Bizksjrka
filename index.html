<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tycoon MMO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root { --bg: #070a10; --panel: #121b28; --accent: #00ffcc; --gold: #ffcc00; --danger: #ff3b30; }
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .hud { padding: 15px; background: rgba(18, 27, 40, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .balance { font-size: 28px; font-weight: 900; color: var(--gold); }
        .crypto { font-size: 14px; color: var(--accent); font-weight: bold; }
        .online-status { font-size: 12px; color: #00ffcc; margin-top: 5px; }
        
        .menu-btn { background: #1c2733; border: none; color: white; padding: 10px 15px; border-radius: 12px; font-size: 20px; cursor: pointer; }
        
        #game-area { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .modal { position: fixed; bottom: -100%; left: 0; right: 0; background: var(--panel); border-radius: 30px 30px 0 0; padding: 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 20; max-height: 85vh; display: flex; flex-direction: column; }
        .modal.open { bottom: 0; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: #1c2733; border-radius: 12px; text-align: center; font-weight: bold; color: #8b9eb0; cursor: pointer; }
        .tab.active { background: var(--accent); color: black; }

        .content { overflow-y: auto; flex: 1; padding-bottom: 20px; display: none; }
        .content.active { display: block; }

        .card { background: #1c2733; border-radius: 16px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .card-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .card-info p { margin: 0; font-size: 13px; color: var(--accent); }
        .card-price { font-weight: bold; color: var(--gold); text-align: right; }
        .card-btn { background: var(--accent); color: black; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; margin-top: 5px; cursor: pointer; width: 100%; }
        .card-btn:disabled { background: #333; color: #666; }

        .lb-item { display: flex; justify-content: space-between; padding: 10px; background: #1c2733; border-radius: 10px; margin-bottom: 5px; font-size: 14px; }
        .raid-btn { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: bold; }

        #toast { position: fixed; top: -60px; left: 50%; transform: translateX(-50%); background: var(--accent); color: black; padding: 12px 24px; border-radius: 30px; font-weight: bold; transition: 0.3s; z-index: 100; }
        #toast.show { top: 20px; }
    </style>
</head>
<body>
    <div id="toast">Текст</div>

    <div class="hud">
        <div>
            <div class="balance" id="ui-balance">0 ₽</div>
            <div class="crypto" id="ui-crypto">0.0 CR</div>
            <div class="online-status" id="ui-online">Подключение...</div>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div id="game-area">
        <canvas id="cityCanvas"></canvas>
    </div>

    <div class="modal" id="menu">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('build', this)">🏗 Стройка</div>
            <div class="tab" onclick="switchTab('war', this)">⚔️ Рейды</div>
        </div>
        
        <div class="content active" id="tab-build"></div>
        <div class="content" id="tab-war">
            <h4>Онлайн игроки:</h4>
            <div id="enemy-list"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // ВСТАВЬ СЮДА СВОЙ КОНФИГ FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "ТВОЙ_API_KEY",
            authDomain: "ТВОЙ_ПРОЕКТ.firebaseapp.com",
            databaseURL: "https://ТВОЙ_ПРОЕКТ-default-rtdb.firebaseio.com",
            projectId: "ТВОЙ_ПРОЕКТ",
            storageBucket: "ТВОЙ_ПРОЕКТ.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        // ==========================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const tg = window.Telegram.WebApp;
        tg.expand();
        const uid = tg.initDataUnsafe?.user?.id || Math.floor(Math.random() * 1000000); // Если не в ТГ, генерим ID

        // --- КОНФИГУРАЦИЯ ---
        const BUILDINGS = {
            "shaurma": { name: "Шаурмичная", baseCost: 1000, income: 5 },
            "office":  { name: "Офис", baseCost: 15000, income: 50 },
            "factory": { name: "Завод", baseCost: 150000, income: 500 },
            "tower":   { name: "Небоскреб", baseCost: 2000000, income: 8000 }
        };

        let myData = { balance: 5000, crypto: 10, buildings: { shaurma: 1, office: 0, factory: 0, tower: 0 }, lastTick: Date.now() };
        let allPlayers = {};

        // --- СИНХРОНИЗАЦИЯ С FIREBASE ---
        const myRef = db.ref('players/' + uid);

        // 1. Слушаем изменения МОЕГО профиля
        myRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Считаем оффлайн доход
                const now = Date.now();
                const dt = (now - data.lastTick) / 1000;
                let income = 0;
                for (let b in data.buildings) income += data.buildings[b] * BUILDINGS[b].income;
                
                myData = data;
                myData.balance += income * dt;
                myData.crypto += (data.buildings.tower * 0.5) * dt;
                myData.lastTick = now;
                
                updateUI();
                myRef.update({ balance: myData.balance, crypto: myData.crypto, lastTick: now });
            } else {
                // Первый запуск
                myRef.set(myData);
            }
        });

        // 2. Слушаем ВСЕХ игроков (для рейдов)
        db.ref('players').on('value', (snapshot) => {
            allPlayers = snapshot.val() || {};
            const onlineCount = Object.keys(allPlayers).length;
            document.getElementById('ui-online').innerText = `В сети: ${onlineCount}`;
            updateWarTab();
        });

        // Игровой цикл (начисление дохода каждую секунду)
        setInterval(() => {
            const now = Date.now();
            const dt = (now - myData.lastTick) / 1000;
            if (dt > 0) {
                let income = 0;
                for (let b in myData.buildings) income += myData.buildings[b] * BUILDINGS[b].income;
                myData.balance += income * dt;
                myData.crypto += (myData.buildings.tower * 0.5) * dt;
                myData.lastTick = now;
                updateUI();
                myRef.update({ balance: myData.balance, crypto: myData.crypto, lastTick: now });
            }
        }, 1000);

        // --- ДЕЙСТВИЯ ---
        function buyBuilding(type) {
            let count = myData.buildings[type] || 0;
            let cost = Math.floor(BUILDINGS[type].baseCost * Math.pow(1.15, count));
            
            if (myData.balance >= cost) {
                myData.balance -= cost;
                myData.buildings[type] = count + 1;
                myRef.update({ balance: myData.balance, buildings: myData.buildings });
                showToast(`Построено: ${BUILDINGS[type].name}`);
                renderBuildTab();
            }
        }

        function raid(targetId) {
            if (targetId == uid) return;
            const target = allPlayers[targetId];
            if (!target) return;

            // Логика боя (шанс 50% + бонус от офисов)
            if (Math.random() < 0.5) {
                let loot = Math.floor(target.balance * 0.1); // Забираем 10%
                if (loot > 0) {
                    myData.balance += loot;
                    myRef.update({ balance: myData.balance });
                    db.ref('players/' + targetId).update({ balance: target.balance - loot });
                    showToast(`Успех! Вы украли ${loot} ₽`);
                }
            } else {
                showToast("Рейд провален! Вы потеряли 500 ₽");
                myData.balance = Math.max(0, myData.balance - 500);
                myRef.update({ balance: myData.balance });
            }
        }

        // --- ИНТЕРФЕЙС ---
        function updateUI() {
            document.getElementById('ui-balance').innerText = Math.floor(myData.balance).toLocaleString() + ' ₽';
            document.getElementById('ui-crypto').innerText = myData.crypto.toFixed(1) + ' CR';
        }

        function toggleMenu() { document.getElementById('menu').classList.toggle('open'); }
        
        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if (tab === 'build') renderBuildTab();
            if (tab === 'war') updateWarTab();
        }

        function renderBuildTab() {
            let html = '';
            for (let [key, b] of Object.entries(BUILDINGS)) {
                let count = myData.buildings[key] || 0;
                let cost = Math.floor(b.baseCost * Math.pow(1.15, count));
                
                html += `
                <div class="card">
                    <div class="card-info">
                        <h3>${b.name}</h3>
                        <p>+${b.income} ₽/сек</p>
                        <p style="color:#8b9eb0; font-size:11px;">У вас: ${count} шт.</p>
                    </div>
                    <div style="width: 120px;">
                        <div class="card-price">${cost.toLocaleString()} ₽</div>
                        <button class="card-btn" onclick="buyBuilding('${key}')" ${myData.balance < cost ? 'disabled' : ''}>Купить</button>
                    </div>
                </div>`;
            }
            document.getElementById('tab-build').innerHTML = html;
        }

        function updateWarTab() {
            let html = '';
            for (let [id, data] of Object.entries(allPlayers)) {
                if (id == uid) continue; // Себя не грабим
                html += `
                <div class="lb-item">
                    <span>Игрок ${id} (${Math.floor(data.balance)} ₽)</span>
                    <button class="raid-btn" onclick="raid('${id}')">Ограбить</button>
                </div>`;
            }
            if (html === '') html = '<p style="text-align:center; color:#8b9eb0;">Пока никого нет</p>';
            document.getElementById('enemy-list').innerHTML = html;
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // --- ГРАФИКА ---
        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.fillStyle = '#070a10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 50;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(1, 0.5);
            ctx.rotate(Math.PI / 4);
            
            for (let x = -5; x <= 5; x++) {
                for (let y = -5; y <= 5; y++) {
                    ctx.fillStyle = (x + y) % 2 === 0 ? '#121b28' : '#182432';
                    ctx.fillRect(x * 70, y * 70, 70, 70);
                }
            }
            
            if (myData.buildings.shaurma > 0) {
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(-25, -25, 50, 50);
            }
            ctx.restore();
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
