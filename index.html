<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metropolis Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #070a10; --panel: #121b28; --accent: #00ffcc; --gold: #ffcc00; --danger: #ff3b30; }
        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; background: var(--bg); color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* Верхняя панель */
        .hud { padding: 15px; background: rgba(18, 27, 40, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .balance { font-size: 28px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }
        .crypto { font-size: 14px; color: var(--accent); font-weight: bold; }
        
        /* Кнопка меню */
        .menu-btn { background: #1c2733; border: none; color: white; padding: 10px 15px; border-radius: 12px; font-size: 20px; cursor: pointer; }
        
        /* Игровое поле (Город) */
        #game-area { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* Модальное окно (Меню) */
        .modal { position: fixed; bottom: -100%; left: 0; right: 0; background: var(--panel); border-radius: 30px 30px 0 0; padding: 20px; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 20; max-height: 80vh; display: flex; flex-direction: column; }
        .modal.open { bottom: 0; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; background: #1c2733; border-radius: 12px; text-align: center; font-weight: bold; color: #8b9eb0; cursor: pointer; transition: 0.2s; }
        .tab.active { background: var(--accent); color: black; }

        .content { overflow-y: auto; flex: 1; padding-bottom: 20px; display: none; }
        .content.active { display: block; }

        .card { background: #1c2733; border-radius: 16px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .card-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .card-info p { margin: 0; font-size: 13px; color: var(--accent); }
        .card-price { font-weight: bold; color: var(--gold); font-size: 16px; text-align: right; }
        .card-btn { background: var(--accent); color: black; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; margin-top: 5px; cursor: pointer; width: 100%; }
        .card-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group input { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #1c2733; color: white; }
        
        .btn-sell { background: var(--danger); color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }

        /* Уведомления */
        #toast { position: fixed; top: -60px; left: 50%; transform: translateX(-50%); background: var(--accent); color: black; padding: 12px 24px; border-radius: 30px; font-weight: bold; transition: 0.3s; z-index: 100; box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3); }
        #toast.show { top: 20px; }
    </style>
</head>
<body>
    <div id="toast">Текст</div>

    <div class="hud">
        <div>
            <div class="balance" id="ui-balance">0 ₽</div>
            <div class="crypto" id="ui-crypto">0.0 CR</div>
        </div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <div id="game-area">
        <canvas id="cityCanvas"></canvas>
    </div>

    <div class="modal" id="menu">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('build', this)">🏗 Стройка</div>
            <div class="tab" onclick="switchTab('trade', this)">💰 Биржа</div>
        </div>
        
        <div class="content active" id="tab-build"></div>
        
        <div class="content" id="tab-trade">
            <h3 style="text-align:center;">Крипто-биржа</h3>
            <p style="text-align:center; color:var(--accent); font-size:24px;" id="ui-market-price">100.00 ₽</p>
            <p style="text-align:center; font-size:12px; color:#8b9eb0; margin-bottom:20px;">Курс меняется каждую секунду.</p>
            <button class="btn-sell" onclick="sellAllCrypto()">Продать всю крипту</button>
        </div>
    </div>

    <script>
        // --- ИНИЦИАЛИЗАЦИЯ TELEGRAM ---
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворот на весь экран

        // --- КОНФИГУРАЦИЯ ИГРЫ ---
        const BUILDINGS = {
            "shaurma": { name: "Шаурмичная", baseCost: 1000, income: 5 },
            "office":  { name: "Офис", baseCost: 15000, income: 50 },
            "factory": { name: "Завод", baseCost: 150000, income: 500 },
            "tower":   { name: "Небоскреб", baseCost: 2000000, income: 8000 }
        };

        // --- СОСТОЯНИЕ ИГРЫ ---
        let state = {
            balance: 5000,
            crypto: 10.0,
            buildings: { shaurma: 1, office: 0, factory: 0, tower: 0 },
            marketPrice: 100.0,
            lastTick: Date.now()
        };

        // Загрузка сохранения
        function loadGame() {
            const saved = localStorage.getItem('tycoon_save');
            if (saved) {
                state = JSON.parse(saved);
                // Пересчет оффлайн-дохода
                const now = Date.now();
                const dt = (now - state.lastTick) / 1000; // в секундах
                let income = 0;
                for (let b in state.buildings) {
                    income += state.buildings[b] * BUILDINGS[b].income;
                }
                state.balance += income * dt;
                state.crypto += (state.buildings.tower * 0.5) * dt; // Крипта капает только с башен
                state.lastTick = now;
                showToast(`Оффлайн доход: +${Math.floor(income * dt)} ₽`);
            }
        }

        // Сохранение
        function saveGame() {
            localStorage.setItem('tycoon_save', JSON.stringify(state));
        }

        // --- ИГРОВОЙ ЦИКЛ (10 раз в секунду) ---
        function gameLoop() {
            const now = Date.now();
            const dt = (now - state.lastTick) / 1000;
            
            if (dt > 0) {
                // Доход
                let income = 0;
                for (let b in state.buildings) {
                    income += state.buildings[b] * BUILDINGS[b].income;
                }
                state.balance += income * dt;
                
                // Крипта с небоскребов
                state.crypto += (state.buildings.tower * 0.5) * dt;
                
                // Колебания рынка
                state.marketPrice = Math.max(10, state.marketPrice + (Math.random() - 0.5) * 2);
                
                state.lastTick = now;
                updateUI();
            }
            requestAnimationFrame(gameLoop);
        }

        // --- ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ---
        function updateUI() {
            document.getElementById('ui-balance').innerText = Math.floor(state.balance).toLocaleString() + ' ₽';
            document.getElementById('ui-crypto').innerText = state.crypto.toFixed(2) + ' CR';
            document.getElementById('ui-market-price').innerText = state.marketPrice.toFixed(2) + ' ₽';
        }

        // --- ЛОГИКА МЕНЮ ---
        function toggleMenu() { document.getElementById('menu').classList.toggle('open'); }
        
        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if (tab === 'build') renderBuildTab();
        }

        function renderBuildTab() {
            let html = '';
            for (let [key, b] of Object.entries(BUILDINGS)) {
                let count = state.buildings[key];
                let cost = Math.floor(b.baseCost * Math.pow(1.15, count));
                
                html += `
                <div class="card">
                    <div class="card-info">
                        <h3>${b.name}</h3>
                        <p>+${b.income} ₽/сек</p>
                        <p style="color:#8b9eb0; font-size:11px; margin-top:5px;">У вас: ${count} шт.</p>
                    </div>
                    <div style="width: 120px;">
                        <div class="card-price">${cost.toLocaleString()} ₽</div>
                        <button class="card-btn" onclick="buyBuilding('${key}')" ${state.balance < cost ? 'disabled' : ''}>Купить</button>
                    </div>
                </div>`;
            }
            document.getElementById('tab-build').innerHTML = html;
        }

        function buyBuilding(type) {
            let count = state.buildings[type];
            let cost = Math.floor(BUILDINGS[type].baseCost * Math.pow(1.15, count));
            
            if (state.balance >= cost) {
                state.balance -= cost;
                state.buildings[type]++;
                saveGame();
                renderBuildTab();
                showToast(`Построено: ${BUILDINGS[type].name}`);
                spawnParticles(window.innerWidth/2, window.innerHeight/2, '#ffcc00');
            }
        }

        function sellAllCrypto() {
            if (state.crypto > 0) {
                let revenue = state.crypto * state.marketPrice;
                state.balance += revenue;
                showToast(`Продано ${state.crypto.toFixed(1)} CR за ${Math.floor(revenue)} ₽`);
                state.crypto = 0;
                saveGame();
            }
        }

        // --- УВЕДОМЛЕНИЯ ---
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // --- ГРАФИКА (ИЗОМЕТРИЧЕСКИЙ ГОРОД) ---
        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function drawCity() {
            ctx.fillStyle = '#070a10';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 50;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(1, 0.5); // Изометрия
            ctx.rotate(Math.PI / 4);
            
            // Земля
            const size = 70;
            for (let x = -5; x <= 5; x++) {
                for (let y = -5; y <= 5; y++) {
                    ctx.fillStyle = (x + y) % 2 === 0 ? '#121b28' : '#182432';
                    ctx.fillRect(x * size, y * size, size, size);
                }
            }

            // Отрисовка зданий (в центре)
            if (state.buildings.shaurma > 0) {
                ctx.fillStyle = '#00ffcc'; // Шаурма
                ctx.fillRect(-size/2 + 10, -size/2 + 10, size - 20, size - 20);
            }
            if (state.buildings.office > 0) {
                ctx.fillStyle = '#ffcc00'; // Офис
                ctx.fillRect(size/2 - 10, -size/2 + 10, size - 20, size - 20);
            }
            if (state.buildings.factory > 0) {
                ctx.fillStyle = '#ff3b30'; // Завод
                ctx.fillRect(-size/2 + 10, size/2 - 10, size - 20, size - 20);
            }
            
            ctx.restore();

            // Партиклы
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                if (p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1;
            
            requestAnimationFrame(drawCity);
        }

        function spawnParticles(x, y, color) {
            for(let i=0; i<20; i++) {
                particles.push({
                    x, y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, 
                    size: Math.random()*5+2, color, life: 1
                });
            }
        }

        // --- СТАРТ ИГРЫ ---
        loadGame();
        renderBuildTab();
        updateUI();
        drawCity();
        gameLoop();
        
        // Автосохранение каждые 5 секунд
        setInterval(saveGame, 5000);

    </script>
</body>
</html>
